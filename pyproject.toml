[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evalguard-worker"
version = "0.1.0"
description = "Cloud fulfilment worker for evalguard: static diagnostics on eval scripts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ghostgates = "ghostgates.cli:main"

[tool.setuptools]
py-modules = []
packages = ["ghostgates"]
